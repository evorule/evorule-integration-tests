# ci.yml — minimal CI for evorule-integration-tests: ecosystem license gate only.
# Calls the shared reusable workflow pinned to a root-repo commit (never @main).
# extra-checkouts floats the four path-dependency sibling repos at their default
# branch (this repo is the cross-repo consistency gate; its semantics track the
# ecosystem tip, and with no Cargo.lock CI already resolves the latest graph).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  license-gate:
    name: license gate
    permissions:
      contents: read
    uses: evorule/evorule/.github/workflows/license-gate.yml@203b1d5cde3d81814292d600f6ce8238b11af222
    with:
      extra-checkouts: "evorule-hash@main evorule-bundle@main evorule-context-inspector@main evorule@main"
